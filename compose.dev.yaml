# Development adds only local S3/SMTP infrastructure to the production stack.
services:
  rustfs:
    image: rustfs/rustfs:latest
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes: [objects:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  objects:
