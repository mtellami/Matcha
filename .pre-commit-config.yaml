repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write
        language: system
        exclude: ^backend/data/locations\.json$
        types_or: [javascript, jsx, ts, tsx, css, html, json, yaml, markdown]
