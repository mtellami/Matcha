# Production application stack. Development adds compose.dev.yaml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: matcha
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U matcha]
      interval: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    environment:
      TRUST_PROXY: "true"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  database:
